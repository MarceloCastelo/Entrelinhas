<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo — Entrelinhas</title>
  <meta name="description" content="Camisetas, moletons, croppeds e acessórios com referências literárias. Explore a estante da Entrelinhas.">
  <meta name="theme-color" content="#171717">
  <meta property="og:title" content="Catálogo — Entrelinhas">
  <meta property="og:description" content="Camisetas, moletons e acessórios para quem lê até o que não está escrito.">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind.config.js"></script>
  <link rel="stylesheet" href="css/style.css">

  <script src="js/produtos.js" defer></script>
  <script src="js/carrinho.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body data-pagina="produtos" class="bg-papel font-sans text-tinta antialiased">
  <div id="cabecalho"></div>

  <main class="mx-auto max-w-site px-4 sm:px-6">
    <header class="border-b border-linha py-12">
      <p class="text-xs font-semibold uppercase tracking-[0.3em] text-vinho">Catálogo</p>
      <h1 id="titulo-catalogo" class="mt-3 font-serif text-5xl sm:text-6xl">Toda a estante</h1>
      <p id="subtitulo-catalogo" class="mt-3 max-w-xl text-grafite"></p>
    </header>

    <form id="filtros" class="sticky top-16 z-30 -mx-4 space-y-4 border-b border-linha bg-papel/95 px-4 py-4 backdrop-blur sm:-mx-6 sm:px-6" role="search">
      <div id="chips-categorias" class="sem-scrollbar -mx-4 flex gap-2 overflow-x-auto px-4 sm:mx-0 sm:flex-wrap sm:px-0" aria-label="Categorias"></div>

      <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
        <label class="flex flex-1 items-center gap-2 border border-linha bg-papel px-3 focus-within:border-tinta">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" class="text-grafite" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span class="sr-only">Buscar</span>
          <input name="busca" type="search" placeholder="Buscar por título, autor ou frase" class="w-full bg-transparent py-2.5 text-sm focus:outline-none">
        </label>
        <div class="flex gap-3">
          <label class="flex-1 sm:flex-none">
            <span class="sr-only">Coleção</span>
            <select name="colecao" class="w-full border border-linha bg-papel px-3 py-2.5 text-sm focus:border-tinta focus:outline-none">
              <option value="">Todas as coleções</option>
            </select>
          </label>
          <label class="flex-1 sm:flex-none">
            <span class="sr-only">Ordenar</span>
            <select name="ordem" class="w-full border border-linha bg-papel px-3 py-2.5 text-sm focus:border-tinta focus:outline-none">
              <option value="">Ordem da estante</option>
              <option value="novidades">Novidades</option>
              <option value="menor-preco">Menor preço</option>
              <option value="maior-preco">Maior preço</option>
              <option value="a-z">A–Z</option>
            </select>
          </label>
        </div>
      </div>
    </form>

    <div class="flex items-center justify-between py-6 text-sm text-grafite">
      <p id="contador-produtos" aria-live="polite"></p>
      <button type="button" id="limpar-filtros" class="underline underline-offset-4 hover:text-vinho">Limpar filtros</button>
    </div>

    <div id="grade-produtos" class="grid grid-cols-2 gap-x-4 gap-y-10 md:grid-cols-3 lg:grid-cols-4"></div>

    <div id="catalogo-vazio" class="py-20 text-center" hidden>
      <p class="font-serif text-3xl">Nada encontrado. Nem nas entrelinhas.</p>
      <p class="mt-3 text-grafite">Tente outra palavra, como “Machado”, “capítulo” ou “moletom”.</p>
    </div>
  </main>

  <div id="rodape"></div>
</body>
</html>
